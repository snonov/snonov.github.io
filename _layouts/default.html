<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <!-- To override required CSS properties -->
    <link rel="stylesheet" href="{{ '/assets/css/styleOver.css' | relative_url }}">
{% seo %}
  </head>

  <body>

    <header>
      <div class="container">
        <a href="{{ '/' | relative_url }}" style="text-decoration: none"><h1>{{ site.title }}</h1></a>       
        <h2>{{ site.description | default: site.github.project_tagline }}</h2>

        <a href="{{ '/' | relative_url }}"><b>Home</b></a>
        <a href="{{ '/TagCloud.html' | relative_url }}"><b>TagCloud</b></a>
        <a href="{{ '/AllPosts.html' | relative_url }}"><b>All Posts</b></a>
        
        <section id="downloads">
          {% if site.show_downloads %}
            <a href="{{ site.github.zip_url }}" class="btn">Download as .zip</a>
            <a href="{{ site.github.tar_url }}" class="btn">Download as .tar.gz</a>
          {% endif %}
          <a href="{{ site.github.repository_url }}" class="btn btn-github"><span class="icon"></span>View on GitHub</a>
        </section>
      </div>
    </header>

    <div class="grid" id="searchBar">
     <div>
         <div id="search">
             <form role="search" method="get" action="{{ '/search.html' | relative_url }}">
                 <input id="searchString" name="q" type="search"
                        placeholder="Search posts: kafka, graalvm, opentelemetry…" aria-label="Search posts">
                 <input id="searchButton" type="submit" value="Search">
             </form>
         </div>
     </div>
    </div>
    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>
    
  </body>
</html>
